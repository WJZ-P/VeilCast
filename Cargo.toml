[package]
name = "veilcast-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Reusable tile permutation plans for decoded video frames"

[lints.rust]
unsafe_code = "forbid"

[dependencies]

[workspace]
members = ["app/src-tauri"]

# Tauri's size guideline; profiles only apply from the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Every frame's tile copies and inversion run in this crate; unoptimised they
# cap `tauri dev` at ~25 fps for 1440p, so debug builds optimise it alone.
[profile.dev.package.veilcast-core]
opt-level = 3
